<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB7DNA 7plus Decodes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 16px;
        }

        header {
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #f0f0f0;
        }

        #status {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .card:hover {
            border-color: #4a4a7a;
        }

        .card-thumb {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0f1a33;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 6px 8px;
        }

        .card-name {
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #c0c0c0;
        }

        .card-meta {
            font-size: 0.65rem;
            color: #666;
            margin-top: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal img {
            max-width: 90%;
            max-height: 80vh;
        }

        #modal-caption {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 24px;
            color: #888;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<header>
    <h1>GB7DNA 7plus Decodes</h1>
    <div id="status">Loading...</div>
</header>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal" onclick="closeModal(event)">
    <span class="modal-close" onclick="document.getElementById('modal').style.display='none'">&times;</span>
    <img id="fullsize-image" src="" alt="">
    <div id="modal-caption"></div>
</div>

<script>
    var ICONS = {
        archive: '<svg viewBox="0 0 48 48" width="64" height="64"><rect x="8" y="4" width="32" height="40" rx="2" fill="none" stroke="#8ab4f8" stroke-width="2"/><line x1="24" y1="4" x2="24" y2="28" stroke="#8ab4f8" stroke-width="2"/><rect x="20" y="28" width="8" height="6" rx="1" fill="none" stroke="#8ab4f8" stroke-width="2"/></svg>',
        document: '<svg viewBox="0 0 48 48" width="64" height="64"><path d="M12 4h18l10 10v30H12z" fill="none" stroke="#f28b82" stroke-width="2"/><path d="M30 4v10h10" fill="none" stroke="#f28b82" stroke-width="2"/><line x1="16" y1="22" x2="32" y2="22" stroke="#f28b82" stroke-width="1.5"/><line x1="16" y1="28" x2="32" y2="28" stroke="#f28b82" stroke-width="1.5"/><line x1="16" y1="34" x2="28" y2="34" stroke="#f28b82" stroke-width="1.5"/></svg>',
        code: '<svg viewBox="0 0 48 48" width="64" height="64"><path d="M18 14l-10 10 10 10" fill="none" stroke="#81c995" stroke-width="2.5" stroke-linecap="round"/><path d="M30 14l10 10-10 10" fill="none" stroke="#81c995" stroke-width="2.5" stroke-linecap="round"/></svg>',
        file: '<svg viewBox="0 0 48 48" width="64" height="64"><path d="M12 4h18l10 10v30H12z" fill="none" stroke="#9e9e9e" stroke-width="2"/><path d="M30 4v10h10" fill="none" stroke="#9e9e9e" stroke-width="2"/></svg>'
    };

    function getFileCategory(filename) {
        var ext = filename.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','bmp','svg','webp'].indexOf(ext) >= 0) return 'image';
        if (['zip','tar','gz','tgz'].indexOf(ext) >= 0) return 'archive';
        if (['pdf'].indexOf(ext) >= 0) return 'document';
        if (['pm','pl','py','sh','c','h'].indexOf(ext) >= 0) return 'code';
        return 'file';
    }

    function formatDate(unixTimestamp) {
        var d = new Date(parseInt(unixTimestamp) * 1000);
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function formatSize(bytes) {
        bytes = parseInt(bytes);
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    async function fetchCSV() {
        var response = await fetch('list.csv');
        var data = await response.text();
        return data.split('\n').filter(function(r) { return r.trim().length > 0; });
    }

    function createGalleryItem(filename, timestamp, size) {
        var card = document.createElement('div');
        card.className = 'card';

        var thumbArea = document.createElement('div');
        thumbArea.className = 'card-thumb';

        var category = getFileCategory(filename);
        if (category === 'image') {
            var img = document.createElement('img');
            img.src = filename;
            img.alt = filename;
            img.loading = 'lazy';
            thumbArea.appendChild(img);
        } else {
            thumbArea.innerHTML = ICONS[category] || ICONS.file;
        }

        var info = document.createElement('div');
        info.className = 'card-info';

        var nameEl = document.createElement('div');
        nameEl.className = 'card-name';
        nameEl.textContent = filename;
        nameEl.title = filename;

        var meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.textContent = formatDate(timestamp) + ' \u00b7 ' + formatSize(size);

        info.appendChild(nameEl);
        info.appendChild(meta);

        card.appendChild(thumbArea);
        card.appendChild(info);

        card.onclick = function() { openItem(filename, category); };
        return card;
    }

    function openItem(filename, category) {
        if (category === 'image') {
            var modal = document.getElementById('modal');
            var fullsizeImage = document.getElementById('fullsize-image');
            var caption = document.getElementById('modal-caption');
            fullsizeImage.src = filename;
            caption.textContent = filename;
            modal.style.display = 'flex';
        } else {
            var link = document.createElement('a');
            link.href = filename;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    function closeModal(event) {
        if (event.target.id === 'modal') {
            event.target.style.display = 'none';
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.getElementById('modal').style.display = 'none';
        }
    });

    async function renderGallery() {
        var rows = await fetchCSV();
        var gallery = document.getElementById('gallery');
        var status = document.getElementById('status');

        status.textContent = rows.length + ' files';

        if (rows.length > 0) {
            var parts = rows[0].split(',');
            status.textContent += ' \u00b7 Latest: ' + formatDate(parts[1]);
        }

        rows.forEach(function(row) {
            var parts = row.split(',');
            var filename = parts[0];
            var timestamp = parts[1];
            var size = parts[2];
            if (filename) {
                var card = createGalleryItem(filename, timestamp, size);
                gallery.appendChild(card);
            }
        });
    }

    renderGallery();
</script>

</body>
</html>
